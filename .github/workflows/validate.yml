name: Validate site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm run check
      - name: Verify the site is served
        run: |
          PORT=38080 node scripts/serve.mjs &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error http://127.0.0.1:38080/ | grep -F '<title>menas.co</title>'; then
              for asset in index.css index.js favicon.ico favicon-32x32.png favicon-16x16.png apple-touch-icon.png; do
                curl --fail --silent --show-error --head "http://127.0.0.1:38080/${asset}" >/dev/null
              done
              exit 0
            fi
            sleep 1
          done
          exit 1
